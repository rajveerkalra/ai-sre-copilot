{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-sre-copilot.fullname" . }}-secrets
  namespace: {{ include "ai-sre-copilot.namespace" . }}
  labels:
    {{- include "ai-sre-copilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  INTERNAL_SERVICE_TOKEN: {{ .Values.secrets.internalServiceToken | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  AUTH_USERS: {{ .Values.secrets.authUsers | quote }}
  DATABASE_URL: {{ include "ai-sre-copilot.databaseUrl" . | quote }}
  DATABASE_URL_SYNC: {{ include "ai-sre-copilot.databaseUrlSync" . | quote }}
{{- end }}
