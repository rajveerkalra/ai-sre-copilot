{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-sre-copilot.fullname" . }}-default-deny-ingress
  namespace: {{ include "ai-sre-copilot.namespace" . }}
  labels:
    {{- include "ai-sre-copilot.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-sre-copilot.fullname" . }}-allow-intra-namespace
  namespace: {{ include "ai-sre-copilot.namespace" . }}
  labels:
    {{- include "ai-sre-copilot.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-sre-copilot.fullname" . }}-allow-ingress-controller
  namespace: {{ include "ai-sre-copilot.namespace" . }}
  labels:
    {{- include "ai-sre-copilot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - executive-dashboard
          - auth-service
          - incident-service
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8050
        - protocol: TCP
          port: 8060
        - protocol: TCP
          port: 8000
{{- end }}
