{{- range $name, $app := .Values.apps }}
{{- if $app.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ include "ai-sre-copilot.namespace" $ }}
  labels:
    {{- include "ai-sre-copilot.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: {{ $name }}
    {{- include "ai-sre-copilot.selectorLabels" $ | nindent 4 }}
  ports:
    - name: http
      port: {{ $app.port }}
      targetPort: http
{{- end }}
{{- end }}
