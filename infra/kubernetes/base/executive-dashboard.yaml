apiVersion: apps/v1
kind: Deployment
metadata:
  name: executive-dashboard
  namespace: ai-sre-copilot
  labels:
    app.kubernetes.io/component: executive-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: executive-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/component: executive-dashboard
    spec:
      containers:
        - name: executive-dashboard
          image: ai-sre-copilot/executive-dashboard:phase6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8050
              name: http
          readinessProbe:
            httpGet: { path: /health, port: http }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: executive-dashboard
  namespace: ai-sre-copilot
spec:
  selector:
    app.kubernetes.io/component: executive-dashboard
  ports:
    - name: http
      port: 8050
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: executive-dashboard
  namespace: ai-sre-copilot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: executive-dashboard
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
