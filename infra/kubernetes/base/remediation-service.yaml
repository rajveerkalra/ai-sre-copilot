apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation-service
  namespace: ai-sre-copilot
  labels:
    app.kubernetes.io/component: remediation-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: remediation-service
  template:
    metadata:
      labels:
        app.kubernetes.io/component: remediation-service
    spec:
      containers:
        - name: remediation-service
          image: ai-sre-copilot/remediation-service:phase5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8032
              name: http
          envFrom:
            - configMapRef: { name: ai-sre-copilot-config }
            - secretRef: { name: ai-sre-copilot-secrets }
          env:
            - name: SERVICE_NAME
              value: remediation-service
            - name: EXECUTION_ENABLED
              value: "true"
            - name: ALLOW_MUTATIONS
              value: "false"
            - name: RUN_MIGRATIONS_ON_STARTUP
              value: "true"
          readinessProbe:
            httpGet: { path: /ready, port: http }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: remediation-service
  namespace: ai-sre-copilot
spec:
  selector:
    app.kubernetes.io/component: remediation-service
  ports:
    - name: http
      port: 8032
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: remediation-service
  namespace: ai-sre-copilot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: remediation-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
