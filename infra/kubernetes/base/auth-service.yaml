apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ai-sre-copilot
  labels:
    app.kubernetes.io/component: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/component: auth-service
    spec:
      containers:
        - name: auth-service
          image: ai-sre-copilot/auth-service:phase7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8060
              name: http
          envFrom:
            - configMapRef: { name: ai-sre-copilot-config }
            - secretRef: { name: ai-sre-copilot-secrets }
          env:
            - name: SERVICE_NAME
              value: auth-service
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ai-sre-copilot
spec:
  selector:
    app.kubernetes.io/component: auth-service
  ports:
    - name: http
      port: 8060
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-service
  namespace: ai-sre-copilot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
