# Flux GitOps skeleton (Phase 8)
# Install Flux first: https://fluxcd.io/flux/installation/
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: ai-sre-copilot
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/EXAMPLE/ai-sre-copilot.git
  ref:
    branch: main
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ai-sre-local
  namespace: flux-system
spec:
  interval: 10m
  type: oci
  url: oci://ghcr.io/EXAMPLE/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-sre-copilot
  namespace: ai-sre-copilot
spec:
  interval: 5m
  releaseName: ai-sre
  chart:
    spec:
      chart: ./infra/helm/ai-sre-copilot
      sourceRef:
        kind: GitRepository
        name: ai-sre-copilot
        namespace: flux-system
      interval: 5m
  values:
    config:
      environment: staging
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ai-sre-copilot-core
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/kubernetes/overlays/local
  prune: true
  sourceRef:
    kind: GitRepository
    name: ai-sre-copilot
  targetNamespace: ai-sre-copilot
