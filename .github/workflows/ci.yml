name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - context-service
          - incident-service
          - investigation-service
          - knowledge-service
          - model-gateway
          - remediation-service
          - sample-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # libs/common is a shared, unpackaged module imported as `libs.common.*`
      # by every service; PYTHONPATH must include the repo root for `import
      # libs...` to resolve outside the Docker image (where it's copied to
      # /libs and PYTHONPATH=/app:/libs instead).
      - name: Run tests
        working-directory: services/${{ matrix.service }}
        env:
          PYTHONPATH: ${{ github.workspace }}:.
        run: python -m pytest -q

  rca-eval-report:
    name: RCA golden-dataset eval report
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/investigation-service/requirements.txt

      - name: Install dependencies
        working-directory: services/investigation-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run eval harness
        working-directory: services/investigation-service
        env:
          PYTHONPATH: ${{ github.workspace }}:.
        run: python -m eval.run_eval --threshold 1.0 --json-out eval-report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rca-eval-report
          path: services/investigation-service/eval-report.json

  frontend:
    name: frontend build (executive-dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/executive-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: services/executive-dashboard
        run: npm ci

      - name: Typecheck + build
        working-directory: services/executive-dashboard
        run: npm run build

  docker-build:
    name: docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - context-service
          - embedding-gateway
          - executive-dashboard
          - incident-service
          - investigation-service
          - knowledge-service
          - model-gateway
          - remediation-service
          - sample-app
          - webhook-sink
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          tags: ai-sre-copilot/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
