server {
    listen 8050;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. A bare `proxy_pass http://auth-service:8060/;`
    # resolves once at nginx startup and caches that IP forever -- if the
    # upstream container is later recreated (a new deploy, a restart, a
    # `docker compose up -d` picking up a rebuilt image) it gets a new IP and
    # every proxied request here starts failing with "Connection refused"
    # until this container is also restarted. Using a variable in proxy_pass
    # forces re-resolution through this resolver on every request instead.
    #
    # Caveat that bit us here: once proxy_pass's target host is a variable,
    # nginx stops doing its usual "replace the matched location prefix with
    # the URI after the host" rewrite -- it forwards exactly the literal URI
    # text written after the variable (just "/" below) and silently drops
    # the rest of the original path. Every request was collapsing to
    # POST/GET "/" on the backend regardless of what the client actually
    # asked for. Fixed by rewriting the prefix off explicitly first, then
    # passing $uri through (no literal URI on proxy_pass -> nginx forwards
    # the current, already-rewritten $uri as-is).
    resolver 127.0.0.11 valid=10s;

    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"executive-dashboard"}';
    }

    location /ready {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ready","service":"executive-dashboard"}';
    }

    location /proxy/auth/ {
        set $upstream_auth auth-service:8060;
        rewrite ^/proxy/auth/(.*)$ /$1 break;
        proxy_pass http://$upstream_auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location /proxy/incident/ {
        set $upstream_incident incident-service:8000;
        rewrite ^/proxy/incident/(.*)$ /$1 break;
        proxy_pass http://$upstream_incident;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /proxy/context/ {
        set $upstream_context context-service:8020;
        rewrite ^/proxy/context/(.*)$ /$1 break;
        proxy_pass http://$upstream_context;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location /proxy/investigation/ {
        set $upstream_investigation investigation-service:8031;
        rewrite ^/proxy/investigation/(.*)$ /$1 break;
        proxy_pass http://$upstream_investigation;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location /proxy/remediation/ {
        set $upstream_remediation remediation-service:8032;
        rewrite ^/proxy/remediation/(.*)$ /$1 break;
        proxy_pass http://$upstream_remediation;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
